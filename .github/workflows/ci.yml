name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  verify:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      DIRECT_DATABASE_URL_TEST: ${{ secrets.DIRECT_DATABASE_URL_TEST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy env template for CI
        run: cp .env.example .env.local

      - name: Generate ephemeral test seed password
        run: >-
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV,
          'SEED_DESK_PASSWORD=' + require('node:crypto').randomBytes(24).toString('base64url') + '\\n')"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Seed isolated test database
        run: npm run db:seed
        env:
          SEED_TARGET: test

      - name: Unit and Contract Tests
        run: npm test

      - name: Build
        run: npx next build --webpack
        env:
          APP_DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL_TEST }}


